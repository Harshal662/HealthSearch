version: "3.8"

services:
  db:
    image: pgvector/pgvector:pg15
    container_name: healthsearch-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 
      POSTGRES_DB: healthsearch
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d

  # ✅ will create extension
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: healthsearch-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/healthsearch
      - BACKEND=postgres
      - HEALTHSEARCH_TOKEN=${HEALTHSEARCH_TOKEN:-ARLil-1-NVwgaYPPWsjonH5AkJ7v1yoOmbSElJF7yzU}
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
      - VECTOR_DIM=384
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
volumes:
  db-data:
